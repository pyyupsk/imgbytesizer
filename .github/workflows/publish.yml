name: 🚀 Publish Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version_tag:
        description: "Tag to use for the release (e.g., v0.1.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: ⬇️ Checkout repository

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        name: 📦 Setup Python
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        name: 📦 Setup uv

      - name: 🔍 Install dependencies
        run: uv sync

      - name: 🔍 Check version is not already published on PyPI
        run: uv run python scripts/check_version.py

  release-build:
    runs-on: ubuntu-latest
    needs:
      - check-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: ⬇️ Checkout repository

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        name: 📦 Setup Python
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        name: 📦 Setup uv

      - name: 🔍 Install dependencies
        run: uv sync

      - name: 🏗 Build release
        run: uv run tox -e build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: 📤 Upload artifact
        with:
          name: release
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/imgbytesizer
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: 📥 Download artifact
        with:
          name: release
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        name: 🚀 Publish package
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs:
      - pypi-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: ⬇️ Checkout repository
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: 📥 Download artifact
        with:
          name: release
          path: dist/

      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        name: 🔑 Sign artifact
        with:
          inputs: dist/*

      - name: 🔧 Set TAG_NAME
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
          fi

      - name: 🛑 Fail if TAG_NAME is unset
        run: |
          if [[ -z "$TAG_NAME" ]]; then
            echo "TAG_NAME is not set!"
            exit 1
          fi

      - name: 📝 Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: 🚀 Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BODY: ${{ steps.changelog.outputs.content }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes "$BODY"
            gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --notes "$BODY"
          fi

  update-changelog:
    runs-on: ubuntu-latest
    needs:
      - github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: ⬇️ Checkout repository
        with:
          fetch-depth: 0
          ref: main

      - name: 📝 Generate full changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: 📤 Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG.md for ${GITHUB_REF##*/}"
            git push origin main
          fi
